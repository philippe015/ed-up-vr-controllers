name: On-foot preview tests
on:
  push:
    branches: [feature/onfoot-vr-enhanced]
    paths: ['vr-controllers/**', '.github/workflows/onfoot-preview-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: cmake -S vr-controllers -B build-preview -DEDUP_POLICY_ONLY=ON -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build-preview --config Release
      - run: ctest --test-dir build-preview -C Release --output-on-failure
