; EXEMPLE - copier près de EliteDangerous64.exe après configuration du jeu.
; Codes physiques hexadécimaux Windows, 0 = désactivé.
; En AZERTY : rangée supérieure 3 / 4 / 5, H / T / M.
; Attribuer les mêmes touches explicitement dans Options > Commandes > À pied.
[Tools]
EnergyLink=0x04
ProfileAnalyser=0x05
SuitTool=0x06
Holster=0x23
Flashlight=0x14
ToolMode=0x32

; Maintenir le grip droit pour orienter la vue par le mouvement de la main.
[MotionAim]
Enabled=1
; Experimental: dominant grip first, then support. Release both to exit.
TwoHandEnabled=0
PixelsPerDegree=10
InvertY=0

[Bindings]
Forward=0x11
Back=0x1F
Left=0x1E
Right=0x20
Jump=0x39
Interact=0x12
Crouch=0x2E
Sprint=0x2A
CycleTool=0x10
Reload=0x13
Primary=0x100
Secondary=0x101

[Movement]
; 0 = fluide, 1/2/3 = paliers indicatifs 15/30/45 degres.
SnapMode=0
SnapPixelsPerDegree=10
ExtraLookDeadzonePercent=0
; 0 = droitier, 1 = gaucher (roles des manettes inverses).
LeftHanded=0
LookPixelsPerSecond=900
ToolLayer=1

[Visual]
Hands=0
Overlay=0
Laser=0
Haptics=0
HapticPercent=25
